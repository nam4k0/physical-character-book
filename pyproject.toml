[project]
name = "ml-lern"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "html2text>=2025.4.15",
]

# 第III部（実装）で使う依存。既定では導入しない。
#   uv sync --extra train   で 強化学習のミニ実装用の依存を入れる
#   uv sync --extra viz     で 可視化用の依存を入れる
[project.optional-dependencies]
train = [
    "torch>=2.3",
    "mujoco>=3.1",
    "gymnasium>=1.0",
    "numpy>=1.26",
]
viz = [
    "matplotlib>=3.8",
]

[project.scripts]
ml-lern = "ml_lern:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
